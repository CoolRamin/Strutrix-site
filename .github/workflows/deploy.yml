name: Deploy to Azure Static Web Apps

# Publishes src/ to the site's Azure Static Web App on every push to main. Pull requests are not
# deployed: a pull request from a fork cannot read the deployment token, so a preview job would only
# fail for outside contributors.
#
# Until the Static Web App exists and its deployment token is stored as the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN, the job checks out, says so, and deploys nothing, so a push stays
# green. Setting the secret is all it takes to start publishing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: No deployment token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; nothing was deployed."

      - name: Deploy src/
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          output_location: ""
          api_location: ""
          skip_app_build: true

      # Asks the search engines that take IndexNow to read the site again now, rather than whenever they next come by.
      # The key is the file src/4f5207f94b32b3e8d6d0275d1a26f596.txt, which proves the request is the site's own. A failure here
      # never fails the deployment.
      - name: Tell search engines what changed (IndexNow)
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: |
          urls=$(grep -oE '<loc>[^<]+</loc>' src/sitemap.xml | sed -E 's#</?loc>##g' | sed -E 's/.*/"&"/' | paste -sd, -)
          body='{"host":"www.strutrix.com","key":"4f5207f94b32b3e8d6d0275d1a26f596","keyLocation":"https://www.strutrix.com/4f5207f94b32b3e8d6d0275d1a26f596.txt","urlList":['"$urls"']}'
          curl -sS -o /dev/null -w 'IndexNow answered %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
