name: Bug report
description: Something in Strutrix Studio does not work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please keep confidential project data out of
        this public issue; for anything private, email admin@ramisoftsolutions.com instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in plain language. A number that looks wrong is a bug too.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new model
        2. Generate a building frame with ...
        3. Run the analysis ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version details
      description: In the program, Help > About > Copy details, then paste here.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area of the program
      options:
        - Modelling, the Studio and the generators
        - Tables and properties
        - Supports, releases, offsets and rigid links
        - Loads and area loads
        - Load combinations and the ASCE 7-22 generator
        - Line loading (NESC, ASCE MOP 74, MOP 113)
        - Analysis, direct analysis or equilibrium
        - Results, diagrams and result tables
        - Steel design and Optimise
        - Tapered tubes (ASCE 48-19)
        - Calculation report
        - IFC or Revit export
        - Cloud, sign-in, or the link to FoundaTrix Studio and PileAxis
        - Installation or start-up
        - Something else
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Model file and screenshots
      description: |
        Attaching the .strx file that shows the problem helps enormously, if it holds nothing
        confidential (rename the project, client and site first). Screenshots, the Validation
        pane's messages and the command line's last lines are welcome too.
    validations:
      required: false
