<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><title>An AI assistant creating a building frame through the RamisoftSolutions Cloud connector: it reads the model type's schema, asks for the floor and roof loads the engineer had not given, checks the model and creates it, unrun, in the engineer's job beside the job's pile and foundation designs</title><defs><linearGradient id="asBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#171c45"/></linearGradient><linearGradient id="asPremium" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7ee6"/><stop offset="0.55" stop-color="#c35bd0"/><stop offset="1" stop-color="#f0388f"/></linearGradient><linearGradient id="asWire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8a9f6"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><pattern id="asGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(148,163,184,0.09)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="760" fill="url(#asBg)"/><rect x="0" y="0" width="1200" height="760" fill="url(#asGrid)"/><rect x="48" y="48" width="620" height="664" rx="20" fill="#121726" stroke="rgba(184,169,246,0.28)" stroke-width="1"/><circle cx="84" cy="88" r="14" fill="url(#asPremium)"/><path d="M84 79 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z" fill="#ffffff"/><text x="108" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E2E8F0" text-anchor="start" font-weight="700">Your AI assistant</text><text x="108" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A3B0C4" text-anchor="start">Connected to your RamisoftSolutions account, signed in as you</text><line x1="48" y1="128" x2="668" y2="128" stroke="rgba(148,163,184,0.18)" stroke-width="1"/><rect x="204" y="146" width="440" height="114" rx="16" fill="#1f6f68"/><text x="224" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#ecfeff" text-anchor="start">Create a three-storey braced steel frame in the</text><text x="224" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#ecfeff" text-anchor="start">job Sample Distribution Centre: four 30 ft bays</text><text x="224" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#ecfeff" text-anchor="start">by two of 25 ft, storeys 16, 14 and 14 ft, W14</text><text x="224" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#ecfeff" text-anchor="start">columns, W18 beams, HSS braces, fixed bases.</text><rect x="72" y="270" width="286.8" height="30" rx="15" fill="rgba(184,169,246,0.12)" stroke="rgba(184,169,246,0.45)" stroke-width="1"/><text x="90" y="290" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#d6ccff" text-anchor="start">get_model_schema · strutrix.frame</text><rect x="370.8" y="270" width="233.6" height="30" rx="15" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.55)" stroke-width="1"/><text x="388.8" y="290" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#fcd34d" text-anchor="start">validate_model · 1 missing</text><rect x="72" y="316" width="470" height="90" rx="16" fill="#1c2233" stroke="rgba(148,163,184,0.22)" stroke-width="1"/><text x="92" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#E2E8F0" text-anchor="start">You have not given the floor and roof loads.</text><text x="92" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#E2E8F0" text-anchor="start">What dead and live loads, in psf?</text><text x="92" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#A3B0C4" text-anchor="start">Missing inputs are asked for, never invented.</text><rect x="300" y="418" width="344" height="48" rx="16" fill="#1f6f68"/><text x="320" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#ecfeff" text-anchor="start">Floors 15 dead, 80 live; roof 10 and 20.</text><rect x="72" y="488" width="180.4" height="30" rx="15" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.55)" stroke-width="1"/><text x="90" y="508" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#86efac" text-anchor="start">validate_model · ok</text><rect x="264.4" y="488" width="165.2" height="30" rx="15" fill="rgba(45,212,191,0.12)" stroke="rgba(45,212,191,0.55)" stroke-width="1"/><text x="282.4" y="508" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5eead4" text-anchor="start">create_model · ok</text><rect x="72" y="534" width="560" height="114" rx="16" fill="#1c2233" stroke="rgba(148,163,184,0.22)" stroke-width="1"/><text x="92" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#E2E8F0" text-anchor="start">Created "Distribution Centre frame": 60 joints, 135</text><text x="92" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#E2E8F0" text-anchor="start">members, its floor and roof area loads, and the ASCE</text><text x="92" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#E2E8F0" text-anchor="start">7-22 combinations. It has not been analysed: open it</text><text x="92" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#E2E8F0" text-anchor="start">in Strutrix Studio and run it.</text><rect x="72" y="664" width="572" height="38" rx="19" fill="#0e1320" stroke="rgba(148,163,184,0.22)" stroke-width="1"/><text x="94" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="start">Ask your assistant…</text><path d="M668 380 C 720 380, 730 300, 790 300" fill="none" stroke="url(#asWire)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M668 380 C 720 380, 730 470, 790 470" fill="none" stroke="url(#asWire)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/><rect x="682" y="362" width="96" height="36" rx="18" fill="#121726" stroke="rgba(45,212,191,0.6)" stroke-width="1"/><text x="730" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5eead4" text-anchor="middle" font-weight="600">MCP</text><rect x="790" y="160" width="362" height="260" rx="20" fill="#f8fafc"/><text x="818" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700" letter-spacing="1.2">RAMISOFTSOLUTIONS CLOUD</text><text x="818" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">Sample Distribution Centre</text><text x="818" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start">Job · 3 designs</text><line x1="818" y1="262" x2="1124" y2="262" stroke="#e2e8f0" stroke-width="1"/><rect x="818" y="274" width="306" height="38" rx="8" fill="#f1f5f9"/><text x="832" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start">Pier P-4</text><text x="832" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">PileAxis</text><rect x="818" y="318" width="306" height="38" rx="8" fill="#f1f5f9"/><text x="832" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start">Column footings</text><text x="832" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">FoundaTrix Studio</text><rect x="818" y="362" width="306" height="38" rx="8" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/><text x="832" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="600">Distribution Centre frame</text><text x="832" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">Strutrix Studio</text><text x="1112" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#0f766e" text-anchor="end">new</text><rect x="790" y="450" width="362" height="262" rx="20" fill="#121726" stroke="rgba(148,163,184,0.22)" stroke-width="1"/><text x="818" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b8a9f6" text-anchor="start" font-weight="700" letter-spacing="1.2">THE SAME PROGRAM BEHIND IT</text><circle cx="826" cy="516" r="9" fill="#2f9e5a"/><polyline points="821.5,516 825,519.5 830.5,512.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="846" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E2E8F0" text-anchor="start">Generate &gt; Building Frame</text><circle cx="826" cy="550" r="9" fill="#2f9e5a"/><polyline points="821.5,550 825,553.5 830.5,546.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="846" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E2E8F0" text-anchor="start">The ASCE 7-22 combination generator</text><circle cx="826" cy="584" r="9" fill="#2f9e5a"/><polyline points="821.5,584 825,587.5 830.5,580.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="846" y="589" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E2E8F0" text-anchor="start">The model's own checks</text><circle cx="826" cy="618" r="9" fill="#2f9e5a"/><polyline points="821.5,618 825,621.5 830.5,614.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="846" y="623" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E2E8F0" text-anchor="start">Missing inputs asked for, not guessed</text><circle cx="826" cy="652" r="9" fill="#475569"/><line x1="822" y1="652" x2="830" y2="652" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="846" y="657" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#A3B0C4" text-anchor="start">Does not change or delete models</text><circle cx="826" cy="686" r="9" fill="#2f9e5a"/><polyline points="821.5,686 825,689.5 830.5,682.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="846" y="691" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#E2E8F0" text-anchor="start">Saved unrun, for you to run</text></svg>
